<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꾸며주는 말과 문장고리</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Comic Sans MS', sans-serif;
            background-color: #f0fdf4; /* 싱그러운 연두빛 배경 */
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 750px; /* 태블릿 가로폭에 맞게 조금 더 넓게 확정 */
            background: white;
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.15);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px dashed #a7f3d0;
            padding-bottom: 15px;
        }
        h1 { color: #047857; font-size: 2.0rem; margin-bottom: 8px; }
        .sub-title { color: #374151; font-weight: bold; font-size: 1.25rem; }
        
        .card {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        .card.active {
            display: flex;
        }

        .role-select-box, .menu-center-box {
            text-align: center;
            padding: 30px 0;
        }
        
        /* 태블릿용 왕특대 버튼 스타일 */
        .role-btn, .menu-btn-custom {
            display: block;
            width: 100%;
            padding: 22px;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            margin-bottom: 18px;
            transition: 0.2s;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .role-student { background-color: #10b981; color: white; }
        .role-student:hover { background-color: #059669; }
        .role-teacher { background-color: #64748b; color: white; }
        .role-teacher:hover { background-color: #475569; }

        .name-input {
            width: 85%;
            padding: 18px;
            font-size: 1.3rem;
            border: 3px solid #10b981;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 25px;
            outline: none;
            background-color: #f9fafb;
        }
        .cheer-text {
            font-size: 1.4rem;
            color: #047857;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            margin: 15px 0;
        }
        .level-card-btn {
            padding: 24px;
            font-size: 1.35rem;
            font-weight: bold;
            border: 3px solid #a7f3d0;
            background: #f0fdf4;
            color: #065f46;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .level-card-btn:hover {
            background: #d1fae5;
            border-color: #10b981;
        }

        /* 퀴즈 영역 (왕특대 그림 및 글씨) */
        .quiz-box {
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
        .quiz-img {
            font-size: 6.5rem; /* 그림 이미지 큼직하고 선명하게 */
            margin-bottom: 15px;
            line-height: 1;
        }
        .sentence-box {
            font-size: 1.6rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 25px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #cbd5e1;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .option-btn {
            padding: 20px;
            font-size: 1.3rem;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            font-weight: bold;
            color: #334155;
            transition: 0.1s;
        }
        .option-btn:hover { border-color: #10b981; background: #f0fdf4; color: #047857; }

        /* 수준3 단어 조합 영역 */
        .word-pool {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .word-chip {
            padding: 14px 22px;
            background: #d1fae5;
            color: #065f46;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            border: 3px dashed #10b981;
            font-size: 1.25rem;
        }
        .sentence-dropzone {
            border: 3px dashed #94a3b8;
            padding: 22px;
            border-radius: 16px;
            text-align: center;
            min-height: 35px;
            font-size: 1.35rem;
            color: #475569;
            background: #ffffff;
            margin-bottom: 20px;
        }

        /* 팝업 모달창 */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            border-radius: 28px;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: white;
            padding: 35px 45px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            animation: popUp 0.2s ease-in-out;
        }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 결과지 스타일 */
        .result-box {
            text-align: center;
            padding: 25px;
            background: #f0fdf4;
            border-radius: 20px;
            border: 3px solid #6ee7b7;
        }
        .result-title { font-size: 1.6rem; color: #047857; font-weight: bold; margin-bottom: 15px; }
        .result-detail { font-size: 1.2rem; color: #1f2937; margin-bottom: 15px; text-align: left; background: white; padding: 20px; border-radius: 14px; line-height: 1.5; }

        .back-btn {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 1.0rem;
            color: #4b5563;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 팝업 모달창 (다시 한번 생각해볼까?) -->
        <div id="custom-modal" class="modal-overlay">
            <div class="modal-content">
                <div style="font-size: 4rem; margin-bottom: 15px;">🤔</div>
                <div style="font-size: 1.4rem; font-weight: bold; color: #047857; margin-bottom: 25px;">다시 한번 생각해 볼까?</div>
                <button class="role-btn role-student" style="padding: 12px 30px; font-size: 1.2rem; margin: 0 auto; width: auto;" onclick="closeModal()">확인</button>
            </div>
        </div>

        <header>
            <h1>3. 겪은 일을 나타내요</h1>
            <div class="sub-title">3차시. 꾸며주는 말과 문장고리를 넣어 문장을 완성하기</div>
        </header>

        <!-- [화면 0] 대상 선택 -->
        <div id="screen-role" class="card active">
            <div class="role-select-box">
                <p style="font-size: 1.35rem; color: #047857; margin-bottom: 30px; font-weight: bold;">👋 반가워요! 누구인가요?</p>
                <button class="role-btn role-student" onclick="goToLogin('student')">🧑‍🎓 학생이에요</button>
                <button class="role-btn role-teacher" onclick="goToLogin('teacher')">👩‍🏫 선생님 / 보호자에요</button>
            </div>
        </div>

        <!-- [화면 1] 로그인 -->
        <div id="screen-login" class="card">
            <div class="role-select-box">
                <div class="cheer-text">✨ 오늘도 열심히 공부해요! 화이팅! ✨</div>
                <p style="margin-bottom: 18px; color: #374151; font-weight: bold; font-size: 1.2rem;">이름을 입력하고 시작해볼까요?</p>
                <input type="text" id="student-name-input" class="name-input" placeholder="이름을 적어주세요 (예: 김이도)">
                <button class="role-btn role-student" onclick="startApp()">공부 시작하기 🚀</button>
                <button class="back-btn" onclick="location.reload()">처음으로</button>
            </div>
        </div>

        <!-- [화면 2] 메인 메뉴 (활동 선택) -->
        <div id="screen-menu" class="card">
            <div style="text-align: center; margin-bottom: 25px;">
                <span id="welcome-msg" style="font-size: 1.4rem; font-weight: bold; color: #047857;"></span>
            </div>
            <div class="level-grid">
                <button class="level-card-btn" onclick="selectActivity(1)">
                    <span>🍎 활동 1: 꾸며주는 말로 문장 완성하기</span>
                    <span style="font-size: 1.8rem;">👉</span>
                </button>
                <button class="level-card-btn" onclick="selectActivity(2)">
                    <span>🔗 활동 2: 문장고리로 문장 완성하기</span>
                    <span style="font-size: 1.8rem;">👉</span>
                </button>
            </div>
            <button class="back-btn" onclick="location.reload()">처음 화면으로</button>
        </div>

        <!-- [화면 3] 활동1 - 단계 선택 화면 -->
        <div id="screen-level-select" class="card">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="color: #047857; font-size: 1.6rem; margin-bottom: 8px;">꾸며주는 말 마스터하기</h2>
                <p style="color: #4b5563; font-size: 1.15rem;">공부하고 싶은 단계를 선택해 주세요!</p>
            </div>
            <div class="level-grid">
                <button class="level-card-btn" onclick="startQuiz(1)">
                    <div><strong>1단계</strong><div style="font-size: 1.0rem; color: #4b5563; font-weight: normal; margin-top: 4px;">색깔·모양·크기 꾸며주기</div></div>
                    <span style="font-size: 1.4rem;">⭐</span>
                </button>
                <button class="level-card-btn" onclick="startQuiz(2)">
                    <div><strong>2단계</strong><div style="font-size: 1.0rem; color: #4b5563; font-weight: normal; margin-top: 4px;">형태·느낌·감정 꾸며주기</div></div>
                    <span style="font-size: 1.4rem;">⭐⭐</span>
                </button>
                <button class="level-card-btn" onclick="startQuiz(3)">
                    <div><strong>3단계</strong><div style="font-size: 1.0rem; color: #4b5563; font-weight: normal; margin-top: 4px;">단어 조각 모아 문장 만들기</div></div>
                    <span style="font-size: 1.4rem;">⭐⭐⭐</span>
                </button>
            </div>
            <button class="back-btn" onclick="enterMenu()">활동 메뉴로 돌아가기</button>
        </div>

        <!-- [화면 4] 퀴즈 풀이 화면 -->
        <div id="screen-quiz" class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span id="quiz-level-title" style="font-weight: bold; color: #047857; font-size: 1.25rem;"></span>
                <span id="quiz-progress" style="font-weight: bold; color: #4b5563; font-size: 1.15rem;"></span>
            </div>
            <div id="quiz-area"></div>
            <button class="back-btn" onclick="showCard('screen-level-select')">단계 선택으로 가기</button>
        </div>

        <!-- [화면 5] 활동 2 (준비중) -->
        <div id="screen-activity2" class="card" style="text-align: center; justify-content: center; padding: 40px 0;">
            <div style="font-size: 4rem; margin-bottom: 15px;">🚧</div>
            <h2 style="color: #047857; font-size: 1.6rem; margin-bottom: 10px;">활동 2: 문장고리 공간</h2>
            <p style="color: #4b5563; font-size: 1.2rem; margin-bottom: 25px;">선생님이 멋진 문장고리 활동을 준비하고 있어요!</p>
            <button class="back-btn" onclick="enterMenu()">활동 메뉴로 돌아가기</button>
        </div>

        <!-- [화면 6] 결과지 화면 -->
        <div id="screen-result" class="card">
            <div class="result-box">
                <div class="result-title">🎉 학습 결과 리포트 🎉</div>
                <div id="result-content"></div>
                <button class="role-btn role-student" style="margin-top: 20px; padding: 16px; font-size: 1.25rem;" onclick="showCard('screen-level-select')">다른 단계 도장깨기 🚀</button>
            </div>
        </div>

        <footer>
            묘량중앙초등학교 제작자: 교사 김경탁
        </footer>
    </div>

    <script>
        let studentName = "";
        let currentLevel = 1;
        let currentQuizIndex = 0;
        let score = 0;
        let wrongList = [];
        let attemptCount = 0; // 해당 문제의 시도 횟수 (0: 첫 시도, 1: 틀려서 재도전 중)

        // 1학년 맞춤형 및 오개념 방지 3어절 문장 데이터 (각 10문제)
        const quizData = {
            1: [
                { emoji: "🍎", sentence: "______ 사과가 열려요.", options: ["빨간", "차가운", "네모난", "작은"], answer: "빨간" },
                { emoji: "🍌", sentence: "______ 바나나를 먹어요.", options: ["노란", "무서운", "커다란", "뜨거운"], answer: "노란" },
                { emoji: "📦", sentence: "______ 상자를 열어요.", options: ["동그란", "네모난", "하얀", "작은"], answer: "네모난" },
                { emoji: "🥛", sentence: "______ 우유를 마셔요.", options: ["빨간", "세모난", "하얀", "커다란"], answer: "하얀" },
                { emoji: "⚽", sentence: "______ 공을 차요.", options: ["네모난", "동그란", "귀여운", "푹신한"], answer: "동그란" },
                { emoji: "🐘", sentence: "______ 코끼리가 걸어요.", options: ["작은", "커다란", "하얀", "빨간"], answer: "커다란" },
                { emoji: "🐜", sentence: "______ 개미가 기어요.", options: ["커다란", "작은", "노란", "동그란"], answer: "작은" },
                { emoji: "🌿", sentence: "______ 풀잎이 자라요.", options: ["초록색", "빨간", "네모난", "차가운"], answer: "초록색" },
                { emoji: "🌙", sentence: "______ 밤이 찾아와요.", options: ["까만", "하얀", "노란", "작은"], answer: "까만" },
                { emoji: "🌷", sentence: "______ 꽃이 피어요.", options: ["예쁜", "차가운", "네모난", "무서운"], answer: "예쁜" }
            ],
            2: [
                { emoji: "🧊", sentence: "______ 얼음을 먹어요.", options: ["차가운", "뜨거운", "귀여운", "무서운"], answer: "차가운" },
                { emoji: "🍲", sentence: "______ 국물을 마셔요.", options: ["시원한", "뜨거운", "푹신한", "무서운"], answer: "뜨거운" },
                { emoji: "🛏️", sentence: "______ 침대에 누워요.", options: ["차가운", "푹신한", "무서운", "따뜻한"], answer: "푹신한" },
                { emoji: "💨", sentence: "______ 바람이 불어요.", options: ["뜨거운", "시원한", "귀여운", "푹신한"], answer: "시원한" },
                { emoji: "☀️", sentence: "______ 햇살이 비쳐요.", options: ["따뜻한", "무서운", "차가운", "시원한"], answer: "따뜻한" },
                { emoji: "🐰", sentence: "______ 토끼가 뛰어요.", options: ["무서운", "귀여운", "뜨거운", "차가운"], answer: "귀여운" },
                { emoji: "🦖", sentence: "______ 공룡이 나타나요.", options: ["귀여운", "무서운", "푹신한", "따뜻한"], answer: "무서운" },
                { emoji: "😊", sentence: "______ 친구가 웃어요.", options: ["기쁜", "무서운", "차가운", "뜨거운"], answer: "기쁜" },
                { emoji: "😢", sentence: "______ 친구가 울어요.", options: ["슬픈", "귀여운", "시원한", "따뜻한"], answer: "슬픈" },
                { emoji: "😡", sentence: "______ 괴물이 화나요.", options: ["화난", "기쁜", "푹신한", "작은"], answer: "화난" }
            ],
            3: [
                { emoji: "🐘", qText: "[커다란 코끼리가 걸어요]", words: ["걸어요", "커다란", "코끼리가"], target: ["커다란", "코끼리가", "걸어요"] },
                { emoji: "🍎", qText: "[빨간 사과가 맛있어요]", words: ["맛있어요", "빨간", "사과가"], target: ["빨간", "사과가", "맛있어요"] },
                { emoji: "🧊", qText: "[차가운 얼음이 녹아요]", words: ["얼음이", "차가운", "녹아요"], target: ["차가운", "얼음이", "녹아요"] },
                { emoji: "🐰", qText: "[귀여운 토끼가 뛰어요]", words: ["뛰어요", "토끼가", "귀여운"], target: ["귀여운", "토끼가", "뛰어요"] },
                { emoji: "🐜", qText: "[작은 개미가 기어요]", words: ["기어요", "개미가", "작은"], target: ["작은", "개미가", "기어요"] },
                { emoji: "☀️", qText: "[따뜻한 햇살이 비쳐요]", words: ["비쳐요", "햇살이", "따뜻한"], target: ["따뜻한", "햇살이", "비쳐요"] },
                { emoji: "🍌", qText: "[노란 바나나를 먹어요]", words: ["먹어요", "노란", "바나나를"], target: ["노란", "바나나를", "먹어요"] },
                { emoji: "🍬", qText: "[푹신한 솜사탕을 봐요]", words: ["봐요", "솜사탕을", "푹신한"], target: ["푹신한", "솜사탕을", "봐요"] },
                { emoji: "🦁", qText: "[무서운 사자가 울어요]", words: ["울어요", "무서운", "사자가"], target: ["무서운", "사자가", "울어요"] },
                { emoji: "📦", qText: "[네모난 상자를 열어요]", words: ["열어요", "상자를", "네모난"], target: ["네모난", "상자를", "열어요"] }
            ]
        };

        let userSentence = [];

        function showCard(cardId) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById(cardId).classList.add('active');
        }

        function goToLogin(role) {
            if (role === 'teacher') {
                studentName = "선생님/보호자";
                enterMenu();
            } else {
                showCard('screen-login');
            }
        }

        function startApp() {
            const input = document.getElementById('student-name-input');
            if (!input.value.trim()) {
                alert("이름을 입력해 주세요!");
                return;
            }
            studentName = input.value.trim();
            enterMenu();
        }

        function enterMenu() {
            document.getElementById('welcome-msg').innerText = `어서와요 ${studentName} 학생! 반가워요!`;
            showCard('screen-menu');
        }

        function selectActivity(num) {
            if (num === 1) {
                showCard('screen-level-select');
            } else {
                showCard('screen-activity2');
            }
        }

        function startQuiz(lvl) {
            currentLevel = lvl;
            currentQuizIndex = 0;
            score = 0;
            wrongList = [];
            showCard('screen-quiz');
            loadQuiz();
        }

        function loadQuiz() {
            attemptCount = 0; // 새 문제이므로 시도 횟수 초기화
            const quizArea = document.getElementById('quiz-area');
            document.getElementById('quiz-level-title').innerText = `[ ${currentLevel}단계 공부 중 ]`;
            document.getElementById('quiz-progress').innerText = `문제 ${currentQuizIndex + 1} / 10`;
            
            if (currentQuizIndex >= 10) {
                showResult();
                return;
            }

            const qData = quizData[currentLevel][currentQuizIndex];
            
            if (currentLevel === 1 || currentLevel === 2) {
                quizArea.innerHTML = `
                    <div class="quiz-box">
                        <div class="quiz-img">${qData.emoji}</div>
                        <div class="sentence-box">${qData.sentence}</div>
                        <div class="options-grid">
                            <button class="option-btn" onclick="checkChoice(0)">${qData.options[0]}</button>
                            <button class="option-btn" onclick="checkChoice(1)">${qData.options[1]}</button>
                            <button class="option-btn" onclick="checkChoice(2)">${qData.options[2]}</button>
                            <button class="option-btn" onclick="checkChoice(3)">${qData.options[3]}</button>
                        </div>
                    </div>
                `;
            } else {
                userSentence = [];
                let shuffledWords = [...qData.words].sort(() => Math.random() - 0.5);
                
                quizArea.innerHTML = `
                    <div class="quiz-box">
                        <div class="quiz-img">${qData.emoji}</div>
                        <div style="font-size: 1.25rem; color: #374151; margin-bottom: 20px; font-weight: bold;">목표 문장을 순서대로 완성해보세요!</div>
                        <div class="word-pool" id="word-pool">
                            ${shuffledWords.map(w => `<div class="word-chip" onclick="pickWord('${w}')">${w}</div>`).join('')}
                        </div>
                        <div id="dropzone" class="sentence-dropzone" onclick="resetSentence()">
                            여기를 눌러 단어를 채워보세요 (클릭하면 초기화)
                        </div>
                        <button class="role-btn role-student" style="padding: 16px; font-size: 1.2rem;" onclick="submitSentence()">정답 확인하기 ✔️</button>
                    </div>
                `;
            }
        }

        function checkChoice(idx) {
            const qData = quizData[currentLevel][currentQuizIndex];
            const selectedWord = qData.options[idx];

            if (selectedWord === qData.answer) {
                // 정답 맞힘
                if (attemptCount === 0) {
                    score++;
                }
                currentQuizIndex++;
                loadQuiz();
            } else {
                // 오답인 경우
                if (attemptCount === 0) {
                    // 첫 번째 오답: 팝업 띄우고 재도전 기회 부여
                    attemptCount = 1;
                    wrongList.push({ sentence: qData.sentence, user: selectedWord, correct: qData.answer });
                    document.getElementById('custom-modal').style.display = 'flex';
                } else {
                    // 두 번째도 틀렸으면 그대로 다음 문제로 진행
                    currentQuizIndex++;
                    loadQuiz();
                }
            }
        }

        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
            // 팝업 닫고 같은 문제를 다시 풀 수 있게 둠 (사용자가 다른 보기 선택 가능)
        }

        function pickWord(word) {
            userSentence.push(word);
            document.getElementById('dropzone').innerText = userSentence.join(' ');
            event.target.style.display = 'none';
        }

        function resetSentence() {
            userSentence = [];
            document.getElementById('dropzone').innerText = "여기를 눌러 단어를 채워보세요 (클릭하면 초기화)";
            document.querySelectorAll('.word-chip').forEach(c => c.style.display = 'block');
        }

        function submitSentence() {
            if (userSentence.length < 3) {
                alert("단어를 모두 골라 문장을 완성해 주세요!");
                return;
            }

            const qData = quizData[3][currentQuizIndex];
            const isMatch = userSentence.every((val, idx) => val === qData.target[idx]);

            if (isMatch) {
                if (attemptCount === 0) {
                    score++;
                }
                currentQuizIndex++;
                loadQuiz();
            } else {
                if (attemptCount === 0) {
                    // 3단계 첫 번째 틀림 -> 팝업 띄우고 재도전 기회 부여 (초기화)
                    attemptCount = 1;
                    wrongList.push({ sentence: qData.qText, user: userSentence.join(' '), correct: qData.target.join(' ') });
                    document.getElementById('custom-modal').style.display = 'flex';
                    resetSentence();
                } else {
                    // 두 번째도 틀렸으면 다음 문제로 진행
                    currentQuizIndex++;
                    loadQuiz();
                }
            }
        }

        function showResult() {
            showCard('screen-result');
            let contentHtml = `
                <div class="result-detail">
                    <strong>👤 학습자:</strong> ${studentName}<br>
                    <strong>🏆 맞은 개수:</strong> ${score} / 10 개<br>
                    <strong>🌟 잘한 점:</strong> ${score >= 8 ? "꾸며주는 말을 멋지게 이해하고 훌륭하게 문장을 완성했어요! 최고예요!" : "끝까지 집중해서 10문제를 모두 마친 멋진 끈기를 보여주었어요!"}
                </div>
            `;

            if (wrongList.length > 0) {
                contentHtml += `
                    <div class="result-detail" style="border-left: 5px solid #10b981;">
                        <strong>💡 아쉬웠던 점 & 복습하기:</strong><br>
                        다음에는 이 문장들을 더 주의 깊게 살펴봐요!<br>
                        <ul style="margin: 8px 0 0 20px; padding: 0;">
                            ${wrongList.map(w => `<li>"${w.sentence}" (처음 고른 답: ${w.user})</li>`).join('')}
                        </ul>
                    </div>
                `;
            } else {
                contentHtml += `
                    <div class="result-detail" style="border-left: 5px solid #10b981;">
                        <strong>💡 아쉬웠던 점:</strong><br>
                        틀린 문제가 하나도 없어요! 모든 문제를 완벽하게 맞혔답니다! 🎉
                    </div>
                `;
            }

            document.getElementById('result-content').innerHTML = contentHtml;
        }
    </script>

</body>
</html>
