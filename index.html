<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꾸며주는 말과 문장고리</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Comic Sans MS', sans-serif;
            background-color: #fdf2f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.15);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed #fbcfe8;
            padding-bottom: 15px;
        }
        h1 { color: #db2777; font-size: 1.6rem; margin-bottom: 5px; }
        .sub-title { color: #4b5563; font-weight: bold; font-size: 1.1rem; }
        
        /* 공통 카드 스타일 */
        .card {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        .card.active {
            display: flex;
        }

        /* 대상 선택 화면 */
        .role-select-box {
            text-align: center;
            padding: 40px 0;
        }
        .role-btn {
            display: block;
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .role-student { background-color: #f472b6; color: white; }
        .role-student:hover { background-color: #ec4899; }
        .role-teacher { background-color: #94a3b8; color: white; }
        .role-teacher:hover { background-color: #64748b; }

        /* 로그인 영역 */
        .login-box {
            text-align: center;
            padding: 30px 0;
        }
        .name-input {
            width: 80%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #f472b6;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }
        .cheer-text {
            font-size: 1.2rem;
            color: #db2777;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 메인 메뉴(활동 선택) */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .menu-btn {
            padding: 22px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 3px solid #fbcfe8;
            background: #fff1f2;
            color: #be185d;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .menu-btn:hover {
            background: #ffe4e6;
            border-color: #f472b6;
        }

        /* 탭 메뉴 (수준별) */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background-color: #f1f5f9;
            color: #64748b;
        }
        .tab-btn.active {
            background-color: #f472b6;
            color: white;
        }

        /* 퀴즈 영역 */
        .quiz-box {
            background: #fffbfe;
            border: 2px solid #fce7f3;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            text-align: center;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 15px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .option-btn {
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }
        .option-btn:hover { border-color: #f472b6; background: #fff1f2; }

        /* 수준3 단어 조합 영역 */
        .word-pool {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .word-chip {
            padding: 10px 16px;
            background: #fce7f3;
            color: #be185d;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            border: 2px dashed #f472b6;
        }
        .sentence-dropzone {
            border: 2px dashed #cbd5e1;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            min-height: 25px;
            font-size: 1.1rem;
            color: #475569;
            background: #f8fafc;
            margin-bottom: 15px;
        }

        /* 결과지 스타일 */
        .result-box {
            text-align: center;
            padding: 20px;
            background: #fdf4ff;
            border-radius: 16px;
            border: 2px solid #f0abfc;
        }
        .result-title { font-size: 1.4rem; color: #a855f7; font-weight: bold; margin-bottom: 15px; }
        .result-detail { font-size: 1.1rem; color: #334155; margin-bottom: 10px; text-align: left; background: white; padding: 15px; border-radius: 10px; }

        .back-btn {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #6b7280;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>3. 겪은 일을 나타내요</h1>
            <div class="sub-title">3차시. 꾸며주는 말과 문장고리를 넣어 문장을 완성하기</div>
        </header>

        <!-- [화면 0] 대상 선택 화면 -->
        <div id="screen-role" class="card active">
            <div class="role-select-box">
                <p style="font-size: 1.2rem; color: #db2777; margin-bottom: 25px; font-weight: bold;">👋반가워요! 누구인가요?</p>
                <button class="role-btn role-student" onclick="goToLogin('student')">🧑‍🎓 학생이에요</button>
                <button class="role-btn role-teacher" onclick="goToLogin('teacher')">👩‍🏫 선생님 / 보호자에요</button>
            </div>
        </div>

        <!-- [화면 1] 학생 이름 입력 화면 -->
        <div id="screen-login" class="card">
            <div class="login-box">
                <div class="cheer-text">✨ 오늘도 열심히 공부해요! 화이팅! ✨</div>
                <p style="margin-bottom: 15px; color: #4b5563; font-weight: bold;">이름을 입력하고 시작해볼까요?</p>
                <input type="text" id="student-name-input" class="name-input" placeholder="이름을 적어주세요 (예: 김이도)">
                <button class="role-btn role-student" onclick="startApp()">공부 시작하기 🚀</button>
                <button class="back-btn" onclick="location.reload()">처음으로 돌아가기</button>
            </div>
        </div>

        <!-- [화면 2] 메인 메뉴 (활동 선택) -->
        <div id="screen-menu" class="card">
            <div style="text-align: center; margin-bottom: 15px;">
                <span id="welcome-msg" style="font-size: 1.3rem; font-weight: bold; color: #db2777;"></span>
            </div>
            <div class="menu-grid">
                <button class="menu-btn" onclick="selectActivity(1)">🍎 활동 1: 꾸며주는 말로 문장 완성하기</button>
                <button class="menu-btn" onclick="selectActivity(2)">🔗 활동 2: 문장고리로 문장 완성하기</button>
            </div>
            <button class="back-btn" onclick="location.reload()">처음 화면으로</button>
        </div>

        <!-- [화면 3] 활동 1 (수준별 10문제) -->
        <div id="screen-activity1" class="card">
            <div class="tab-container">
                <button id="lvl-btn-1" class="tab-btn active" onclick="setLevel(1)">1단계 (색·모양·크기)</button>
                <button id="lvl-btn-2" class="tab-btn" onclick="setLevel(2)">2단계 (느낌·감정)</button>
                <button id="lvl-btn-3" class="tab-btn" onclick="setLevel(3)">3단계 (문장 만들기)</button>
            </div>

            <div id="quiz-area"></div>
            <button class="back-btn" onclick="goToMenu()">활동 메뉴로 돌아가기</button>
        </div>

        <!-- [화면 4] 활동 2 (준비중 공간) -->
        <div id="screen-activity2" class="card" style="text-align: center; justify-content: center; padding: 40px 0;">
            <div style="font-size: 3rem; margin-bottom: 15px;">🚧</div>
            <h2 style="color: #db2777; margin-bottom: 10px;">활동 2: 문장고리 공간</h2>
            <p style="color: #64748b; margin-bottom: 25px;">선생님이 멋진 문장고리 활동을 준비하고 있어요!</p>
            <button class="back-btn" onclick="goToMenu()">활동 메뉴로 돌아가기</button>
        </div>

        <!-- [화면 5] 결과지 화면 -->
        <div id="screen-result" class="card">
            <div class="result-box">
                <div class="result-title">🎉 학습 결과 리포트 🎉</div>
                <div id="result-content"></div>
                <button class="role-btn role-student" style="margin-top: 15px; padding: 12px;" onclick="goToMenu()">다른 활동 하러 가기</button>
            </div>
        </div>

        <footer>
            묘량중앙초등학교 제작자: 교사 김경탁
        </footer>
    </div>

    <script>
        let studentName = "";
        let currentLevel = 1;
        let currentQuizIndex = 0;
        let score = 0;
        let wrongList = [];

        // 문제 데이터 (단계별 10문제)
        const quizData = {
            1: [
                { q: "🔴 빨간 사과 그림이에요. 알맞은 말은?", options: ["차가운", "빨간", "네모난", "작은"], answer: "빨간" },
                { q: "🟡 노란 바나나 그림이에요. 알맞은 말은?", options: ["노란", "무서운", "커다란", "뜨거운"], answer: "노란" },
                { q: "⬜ 네모난 상자 그림이에요. 알맞은 말은?", options: ["동그란", "네모난", "하얀", "작은"], answer: "네모난" },
                { q: "⚪ 하얀 우유 그림이에요. 알맞은 말은?", options: ["빨간", "세모난", "하얀", "커다란"], answer: "하얀" },
                { q: "🔺 세모난 조각 그림이에요. 알맞은 말은?", options: ["세모난", "노란", "따뜻한", "차가운"], answer: "세모난" },
                { q: "🔵 동그란 공 그림이에요. 알맞은 말은?", options: ["네모난", "동그란", "귀여운", "푹신한"], answer: "동그란" },
                { q: "🐘 커다란 코끼리 그림이에요. 알맞은 말은?", options: ["작은", "커다란", "하얀", "빨간"], answer: "커다란" },
                { q: "🐜 작은 개미 그림이에요. 알맞은 말은?", options: ["커다란", "작은", "노란", "동그란"], answer: "작은" },
                { q: "🟢 초록색 풀잎 그림이에요. 알맞은 말은?", options: ["초록색", "빨간", "네모난", "차가운"], answer: "초록색" },
                { q: "⬛ 까만 밤하늘 그림이에요. 알맞은 말은?", options: ["까만", "하얀", "노란", "작은"], answer: "까만" }
            ],
            2: [
                { q: "🧊 얼음처럼 차가운 느낌이에요. 알맞은 말은?", options: ["차가운", "뜨거운", "귀여운", "무서운"], answer: "차가운" },
                { q: "🔥 뜨거운 국물 느낌이에요. 알맞은 말은?", options: ["시원한", "뜨거운", "푹신한", "무서운"], answer: "뜨거운" },
                { q: "🛏️ 푹신한 침대 느낌이에요. 알맞은 말은?", options: ["차가운", "푹신한", "무서운", "따뜻한"], answer: "푹신한" },
                { q: "🧊 시원한 바람 느낌이에요. 알맞은 말은?", options: ["뜨거운", "시원한", "귀여운", "푹신한"], answer: "시원한" },
                { q: "☀️ 따뜻한 햇살 느낌이에요. 알맞은 말은?", options: ["따뜻한", "무서운", "차가운", "시원한"], answer: "따뜻한" },
                { q: "🐶 귀여운 강아지 감정이에요. 알맞은 말은?", options: ["무서운", "귀여운", "뜨거운", "차가운"], answer: "귀여운" },
                { q: "🦖 무서운 공룡 감정이에요. 알맞은 말은?", options: ["귀여운", "무서운", "푹신한", "따뜻한"], answer: "무서운" },
                { q: "😊 기쁜 표정 감정이에요. 알맞은 말은?", options: ["기쁜", "무서운", "차가운", "뜨거운"], answer: "기쁜" },
                { q: "😢 슬픈 표정 감정이에요. 알맞은 말은?", options: ["슬픈", "귀여운", "시원한", "따뜻한"], answer: "슬픈" },
                { q: "😡 화난 표정 감정이에요. 알맞은 말은?", options: ["화난", "기쁜", "푹신한", "작은"], answer: "화난" }
            ],
            3: [
                { q: "🧩 목표 문장: [커다란 코끼리가 걸어요]", words: ["걸어요", "커다란", "코끼리가"], target: ["커다란", "코끼리가", "걸어요"] },
                { q: "🧩 목표 문장: [빨간 사과가 맛있어요]", words: ["맛있어요", "빨간", "사과가"], target: ["빨간", "사과가", "맛있어요"] },
                { q: "🧩 목표 문장: [차가운 얼음이 녹아요]", words: ["얼음이", "차가운", "녹아요"], target: ["차가운", "얼음이", "녹아요"] },
                { q: "🧩 목표 문장: [귀여운 토끼가 뛰어요]", words: ["뛰어요", "토끼가", "귀여운"], target: ["귀여운", "토끼가", "뛰어요"] },
                { q: "🧩 목표 문장: [작은 개미가 기어요]", words: ["기어요", "개미가", "작은"], target: ["작은", "개미가", "기어요"] },
                { q: "🧩 목표 문장: [따뜻한 햇살이 비쳐요]", words: ["비쳐요", "햇살이", "따뜻한"], target: ["따뜻한", "햇살이", "비쳐요"] },
                { q: "🧩 목표 문장: [노란 바나나를 먹어요]", words: ["먹어요", "노란", "바나나를"], target: ["노란", "바나나를", "먹어요"] },
                { q: "🧩 목표 문장: [푹신한 솜사탕을 봐요]", words: ["봐요", "솜사탕을", "푹신한"], target: ["푹신한", "솜사탕을", "봐요"] },
                { q: "🧩 목표 문장: [무서운 사자가 울어요]", words: ["울어요", "무서운", "사자가"], target: ["무서운", "사자가", "울어요"] },
                { q: "🧩 목표 문장: [네모난 상자를 열어요]", words: ["열어요", "상자를", "네모난"], target: ["네모난", "상자를", "열어요"] }
            ]
        };

        let userSentence = [];

        function showCard(cardId) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById(cardId).classList.add('active');
        }

        function goToLogin(role) {
            if (role === 'teacher') {
                studentName = "선생님/보호자";
                enterMenu();
            } else {
                showCard('screen-login');
            }
        }

        function startApp() {
            const input = document.getElementById('student-name-input');
            if (!input.value.trim()) {
                alert("이름을 입력해 주세요!");
                return;
            }
            studentName = input.value.trim();
            enterMenu();
        }

        function enterMenu() {
            document.getElementById('welcome-msg').innerText = `어서와요 ${studentName} 학생! 반가워요!`;
            showCard('screen-menu');
        }

        function selectActivity(num) {
            if (num === 1) {
                showCard('screen-activity1');
                setLevel(1);
            } else {
                showCard('screen-activity2');
            }
        }

        function goToMenu() {
            showCard('screen-menu');
        }

        function setLevel(lvl) {
            currentLevel = lvl;
            currentQuizIndex = 0;
            score = 0;
            wrongList = [];

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('lvl-btn-' + lvl).classList.add('active');

            loadQuiz();
        }

        function loadQuiz() {
            const quizArea = document.getElementById('quiz-area');
            
            if (currentQuizIndex >= 10) {
                showResult();
                return;
            }

            const qData = quizData[currentLevel][currentQuizIndex];
            
            if (currentLevel === 1 || currentLevel === 2) {
                quizArea.innerHTML = `
                    <div style="font-weight: bold; color: #db2777; margin-bottom: 10px;">[ ${currentLevel}단계 ] 문제 ${currentQuizIndex + 1} / 10</div>
                    <div class="quiz-box">
                        <div class="question-text">${qData.q}</div>
                        <div class="options-grid">
                            <button class="option-btn" onclick="checkChoice('${qData.options[0]}', '${qData.answer}')">${qData.options[0]}</button>
                            <button class="option-btn" onclick="checkChoice('${qData.options[1]}', '${qData.answer}')">${qData.options[1]}</button>
                            <button class="option-btn" onclick="checkChoice('${qData.options[2]}', '${qData.answer}')">${qData.options[2]}</button>
                            <button class="option-btn" onclick="checkChoice('${qData.options[3]}', '${qData.answer}')">${qData.options[3]}</button>
                        </div>
                    </div>
                `;
            } else {
                userSentence = [];
                let shuffledWords = [...qData.words].sort(() => Math.random() - 0.5);
                
                quizArea.innerHTML = `
                    <div style="font-weight: bold; color: #db2777; margin-bottom: 10px;">[ 3단계 ] 문제 ${currentQuizIndex + 1} / 10</div>
                    <div class="quiz-box">
                        <div class="question-text">${qData.q}</div>
                        <div class="word-pool" id="word-pool">
                            ${shuffledWords.map(w => `<div class="word-chip" onclick="pickWord('${w}')">${w}</div>`).join('')}
                        </div>
                        <div id="dropzone" class="sentence-dropzone" onclick="resetSentence()">
                            여기를 눌러 단어를 채워보세요 (클릭하면 초기화)
                        </div>
                        <button class="role-btn role-student" style="padding: 10px; font-size: 1rem;" onclick="submitSentence()">정답 확인!</button>
                    </div>
                `;
            }
        }

        function checkChoice(selected, answer) {
            const qData = quizData[currentLevel][currentQuizIndex];
            if (selected === answer) {
                score++;
            } else {
                wrongList.push({ q: qData.q, user: selected, correct: answer });
            }
            currentQuizIndex++;
            loadQuiz();
        }

        function pickWord(word) {
            userSentence.push(word);
            document.getElementById('dropzone').innerText = userSentence.join(' ');
            
            // 사용한 단어는 숨기기
            event.target.style.display = 'none';
        }

        function resetSentence() {
            userSentence = [];
            document.getElementById('dropzone').innerText = "여기를 눌러 단어를 채워보세요 (클릭하면 초기화)";
            document.querySelectorAll('.word-chip').forEach(c => c.style.display = 'block');
        }

        function submitSentence() {
            if (userSentence.length < 3) {
                alert("단어를 모두 골라 문장을 완성해 주세요!");
                return;
            }

            const qData = quizData[3][currentQuizIndex];
            const isMatch = userSentence.every((val, idx) => val === qData.target[idx]);

            if (isMatch) {
                score++;
            } else {
                wrongList.push({ q: qData.q, user: userSentence.join(' '), correct: qData.target.join(' ') });
            }
            currentQuizIndex++;
            loadQuiz();
        }

        function showResult() {
            showCard('screen-result');
            let contentHtml = `
                <div class="result-detail">
                    <strong>👤 학습자:</strong> ${studentName}<br>
                    <strong>🏆 맞은 개수:</strong> ${score} / 10 개<br>
                    <strong>🌟 잘한 점:</strong> ${score >= 8 ? "꾸며주는 말을 완벽하게 이해하고 멋지게 문장을 완성했어요! 최고예요!" : "끝까지 집중해서 10문제를 모두 풀어낸 멋진 끈기를 보여주었어요!"}
                </div>
            `;

            if (wrongList.length > 0) {
                contentHtml += `
                    <div class="result-detail" style="border-left: 4px solid #f43f5e;">
                        <strong>💡 아쉬웠던 점 & 복습하기:</strong><br>
                        다음에 다시 풀 때 이 부분을 조금 더 주의해봐요!<br>
                        <ul style="margin: 5px 0 0 20px; padding: 0;">
                            ${wrongList.map(w => `<li>${w.q.split(':')[0]} (내가 쓴 답: ${w.user})</li>`).join('')}
                        </ul>
                    </div>
                `;
            } else {
                contentHtml += `
                    <div class="result-detail" style="border-left: 4px solid #10b981;">
                        <strong>💡 아쉬웠던 점:</strong><br>
                        틀린 문제가 하나도 없어요! 완벽하게 다 맞췄답니다! 🎉
                    </div>
                `;
            }

            document.getElementById('result-content').innerHTML = contentHtml;
        }
    </script>

</body>
</html>
